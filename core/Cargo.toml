[package]
name = "rentnerproxy-controller"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
marketplace-app-catalog = { git = "https://github.com/RentnerProxy/marketplace.git", rev = "b5761fb1fc2237f34c88442bb52ce04c328528d2" }
marketplace-app-pipeline = { git = "https://github.com/RentnerProxy/marketplace.git", rev = "b5761fb1fc2237f34c88442bb52ce04c328528d2" }
marketplace-artifacts = { git = "https://github.com/RentnerProxy/marketplace.git", rev = "b5761fb1fc2237f34c88442bb52ce04c328528d2" }
rentnerproxy-app-contracts = { git = "https://github.com/RentnerProxy/marketplace.git", rev = "b5761fb1fc2237f34c88442bb52ce04c328528d2" }
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "tokio",
    "http1",
    "query",
] }
base64 = "0.23.1"
bytes = "1.12.1"
hickory-resolver = { version = "0.26.3", default-features = false, features = [
    "tokio",
    "system-config",
] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
httpdate = "1.0.3"
ipnet = "2.12.2"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "rcgen"] }
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "blocking",
    "json",
] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tempfile = "3.27.0"
x509-parser = "0.18.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
] }
rusqlite = { version = "0.43.0", default-features = false, features = [
    "bundled",
    "limits",
    "hooks",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
aead-gcm-stream = "0.4.1"
aes = "0.8.4"
jsonschema = { version = "0.63.0", default-features = false }
zeroize = "1"
