# The two local socket directories share this policy. Never trust local claims of a role.
local   all            postgres                                   peer
local   rentnerproxy   rentnerproxy                               peer map=appliance
local   sameuser       /^rp_app_[2-5][0-9]{4}$                     scram-sha-256
local   all            all                                        reject
host    rentnerproxy   rentnerproxy        127.0.0.1/32           scram-sha-256
host    all            all                 all                    reject
