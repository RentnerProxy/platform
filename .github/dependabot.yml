version: 2

updates:
    - package-ecosystem: 'bun'
      directories:
          - '/'
          - '/web/src/tests/fixtures/app-runtime-reference'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          bun-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'cargo'
      directories:
          - '/core'
          - '/core/tests/fixtures/app-runtime-reference'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          cargo-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'gomod'
      # CrowdSec's workspace overlay has no local sources for Dependabot's tidy step.
      # The scheduled dependency audit checks it without changing the workspace locks.
      directories:
          - '/core/caddy-modules/responsecache'
          - '/docker/gosu/tooling'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          gomod-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'docker'
      directories:
          - '/docker/production'
          - '/docker/proxy-runtime'
          - '/docker/tooling/coverage'
          - '/docker/tooling/distribution'
          - '/docker/web'
          - '/scripts/smoke/http3'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          docker-by-dependency:
              applies-to: 'version-updates'
              group-by: 'dependency-name'

    - package-ecosystem: 'docker-compose'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      ignore:
          # Do not recursively update RentnerProxy's own release channel.
          - dependency-name: 'rentnerproxy/platform'

    - package-ecosystem: 'github-actions'
      directories:
          - '/'
          - '/.github/actions/*'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          github-actions-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
