name: App Runtime Reference

on:
    # Every pull request reports this check so it can be required. The change detector skips the
    # work when no app runtime input changed.
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: app-runtime-reference-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        uses: ./.github/workflows/detect-changes.yml

    native:
        name: Native app runtime reference (${{ matrix.architecture }})
        needs: changes
        if: ${{ !cancelled() }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: amd64
                      runner: ubuntu-24.04
                      host: Linux/x86_64
                    - architecture: arm64
                      runner: ubuntu-24.04-arm
                      host: Linux/aarch64
        env:
            ARCHITECTURE: ${{ matrix.architecture }}
            RUN_CHECK: ${{ needs.changes.outputs.app_runtime != 'false' }}
        steps:
            - name: Require successful change detection
              env:
                  CHANGE_RESULT: ${{ needs.changes.result }}
              run: test "$CHANGE_RESULT" = success

            - name: Report unaffected check
              if: env.RUN_CHECK != 'true'
              run: echo 'No app runtime input changed; this check does not need to run.'

            - name: Check out exact tested commit
              if: env.RUN_CHECK == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}

            - name: Require native Linux and Docker execution
              if: env.RUN_CHECK == 'true'
              shell: bash
              env:
                  EXPECTED_HOST: ${{ matrix.host }}
              run: |
                  test "$(uname -s)/$(uname -m)" = "$EXPECTED_HOST"
                  test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "linux/$ARCHITECTURE"

            - name: Set up Bun
              if: env.RUN_CHECK == 'true'
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.5

            - name: Install locked browser fixture dependencies and Chromium
              if: env.RUN_CHECK == 'true'
              shell: bash
              working-directory: web/src/tests/fixtures/app-runtime-reference
              # Hosted AMD64 runners already ship Chromium's system libraries, but refreshing their many
              # apt sources regularly takes minutes. Install system packages only when one is missing.
              run: |
                  bun install --no-env-file --frozen-lockfile
                  node node_modules/@playwright/test/cli.js install --only-shell chromium
                  shell=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome-headless-shell -o -name headless_shell \) -print -quit)
                  if [ -z "$shell" ] || ldd "$shell" | grep -q 'not found'; then
                      node node_modules/@playwright/test/cli.js install-deps chromium
                  fi

            - name: Verify the native app runtime reference
              if: env.RUN_CHECK == 'true'
              shell: bash
              run: |
                  bun --no-env-file --no-orphans .github/scripts/ci/fixtures/app-runtime-reference/run.ts "$ARCHITECTURE" "$RUNNER_TEMP/app-runtime-reference"
                  test -s "$RUNNER_TEMP/app-runtime-reference/native.json"
                  test -s "$RUNNER_TEMP/app-runtime-reference/browser.json"

            - name: Set up the controller Rust toolchain
              if: env.RUN_CHECK == 'true'
              shell: bash
              run: |
                  rustup toolchain install 1.99.1 --profile minimal
                  rustup override set 1.99.1

            - name: Restore Cargo dependency cache
              if: env.RUN_CHECK == 'true'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-1.99.1-${{ hashFiles('core/Cargo.lock') }}

            - name: Verify synthetic Greeting packages and browser fixture
              if: env.RUN_CHECK == 'true'
              shell: bash
              env:
                  REPOSITORY_ID: ${{ github.repository_id }}
              run: |
                  bun install --no-env-file --frozen-lockfile --ignore-scripts
                  bash .github/scripts/ci/fixtures/app-greeting-native.sh "$RUNNER_TEMP/app-runtime-reference" "$REPOSITORY_ID"
            - name: Verify provider registration across signed lifecycle generations
              if: env.RUN_CHECK == 'true'
              shell: bash
              run: bash .github/scripts/ci/fixtures/app-provider-lifecycle.sh

            - name: Verify privileged app IPC and UI boundaries natively
              if: env.RUN_CHECK == 'true'
              shell: bash
              run: bash .github/scripts/ci/fixtures/app-ipc-boundaries.sh

            - name: Verify app database provisioning and data migrations
              if: env.RUN_CHECK == 'true'
              shell: bash
              run: bash .github/scripts/ci/fixtures/app-data-migrations.sh

            - name: Set up Buildx for the native appliance
              if: env.RUN_CHECK == 'true'
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build the production appliance from this revision
              if: env.RUN_CHECK == 'true'
              id: appliance
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  DOCKER_BUILD_SUMMARY: 'false'
                  DOCKER_BUILD_RECORD_UPLOAD: 'false'
              with:
                  context: .
                  file: docker/production/Dockerfile
                  platforms: linux/${{ matrix.architecture }}
                  push: false
                  load: true
                  tags: rentnerproxy-app-runtime-reference:ci
                  cache-from: |
                      type=registry,ref=ghcr.io/rentnerproxy/platform-build-cache:production-${{ matrix.architecture }}
                      type=gha,version=2,scope=dependency-audit-appliance-${{ matrix.architecture }}-v1,timeout=2m

            - name: Verify published Greeting lifecycle, distribution gates, data migrations, approved capabilities and portable offline recovery
              if: env.RUN_CHECK == 'true'
              shell: bash
              env:
                  GREETING_APPLIANCE_IMAGE_ID: ${{ steps.appliance.outputs.imageid }}
              run: bash .github/scripts/ci/fixtures/app-greeting-lifecycle.sh "$RUNNER_TEMP/app-runtime-reference"

            - name: Verify an offline restore of an installed catalog app
              if: env.RUN_CHECK == 'true'
              shell: bash
              env:
                  APPLIANCE_IMAGE_ID: ${{ steps.appliance.outputs.imageid }}
              run: bun --no-env-file --no-orphans .github/scripts/ci/fixtures/app-offline-restore.ts "$APPLIANCE_IMAGE_ID" "$RUNNER_TEMP/app-runtime-reference"

            - name: Check out the comparison baseline
              if: env.RUN_CHECK == 'true' && github.event_name == 'pull_request'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: .tools/appliance-comparison-base
                  persist-credentials: false

            - name: Build the previous production appliance
              if: env.RUN_CHECK == 'true' && github.event_name == 'pull_request'
              id: previous-appliance
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  DOCKER_BUILD_SUMMARY: 'false'
                  DOCKER_BUILD_RECORD_UPLOAD: 'false'
              with:
                  context: .tools/appliance-comparison-base
                  file: .tools/appliance-comparison-base/docker/production/Dockerfile
                  platforms: linux/${{ matrix.architecture }}
                  push: false
                  load: true
                  tags: rentnerproxy-app-runtime-reference:base
                  cache-from: |
                      type=registry,ref=ghcr.io/rentnerproxy/platform-build-cache:production-${{ matrix.architecture }}
                      type=gha,version=2,scope=dependency-audit-appliance-${{ matrix.architecture }}-v1,timeout=2m

            - name: Compare the images and verify the same-volume upgrade and rollback
              if: env.RUN_CHECK == 'true' && github.event_name == 'pull_request'
              env:
                  BASELINE_IMAGE_ID: ${{ steps.previous-appliance.outputs.imageid }}
                  CANDIDATE_IMAGE_ID: ${{ steps.appliance.outputs.imageid }}
              run: bash .github/scripts/ci/fixtures/app-image-comparison.sh "$BASELINE_IMAGE_ID" "$CANDIDATE_IMAGE_ID"

            - name: Upload native and browser evidence
              if: env.RUN_CHECK == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: app-runtime-reference-${{ matrix.architecture }}-${{ github.run_attempt }}
                  if-no-files-found: error
                  retention-days: 14
                  path: |
                      ${{ runner.temp }}/app-runtime-reference/native.json
                      ${{ runner.temp }}/app-runtime-reference/browser.json
                      ${{ runner.temp }}/app-runtime-reference/greeting.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-browser.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-lifecycle.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-gates.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-migrations.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-grants.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-recovery.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-offline-restore.json
