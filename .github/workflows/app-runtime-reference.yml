name: App Runtime Reference

on:
    pull_request:
        paths:
            - .github/workflows/app-runtime-reference.yml
            - .github/scripts/ci/fixtures/app-greeting-native.sh
            - '.github/scripts/ci/fixtures/app-runtime-reference/**'
            - 'core/src/app_install.rs'
            - 'core/src/app_install/**'
            - core/Cargo.lock
            - core/Cargo.toml
            - 'core/tests/private/app_install.rs'
            - 'core/tests/private/app_install/**'
            - 'core/tests/fixtures/app-runtime-reference/**'
            - scripts/smoke/wait.ts
            - 'web/src/lib/AppUi/**'
            - web/src/server/security-headers.ts
            - 'web/src/tests/fixtures/app-runtime-reference/**'
            - 'web/src/tests/fixtures/app-template/**'
            - bun.lock
            - package.json
    push:
        branches: [main]
        paths:
            - .github/workflows/app-runtime-reference.yml
            - .github/scripts/ci/fixtures/app-greeting-native.sh
            - '.github/scripts/ci/fixtures/app-runtime-reference/**'
            - 'core/src/app_install.rs'
            - 'core/src/app_install/**'
            - core/Cargo.lock
            - core/Cargo.toml
            - 'core/tests/private/app_install.rs'
            - 'core/tests/private/app_install/**'
            - 'core/tests/fixtures/app-runtime-reference/**'
            - scripts/smoke/wait.ts
            - 'web/src/lib/AppUi/**'
            - web/src/server/security-headers.ts
            - 'web/src/tests/fixtures/app-runtime-reference/**'
            - 'web/src/tests/fixtures/app-template/**'
            - bun.lock
            - package.json
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: app-runtime-reference-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    native:
        name: Native app runtime reference (${{ matrix.architecture }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: amd64
                      runner: ubuntu-24.04
                      host: Linux/x86_64
                    - architecture: arm64
                      runner: ubuntu-24.04-arm
                      host: Linux/aarch64
        env:
            ARCHITECTURE: ${{ matrix.architecture }}
        steps:
            - name: Check out exact tested commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}

            - name: Require native Linux and Docker execution
              shell: bash
              env:
                  EXPECTED_HOST: ${{ matrix.host }}
              run: |
                  test "$(uname -s)/$(uname -m)" = "$EXPECTED_HOST"
                  test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "linux/$ARCHITECTURE"

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: Install locked browser fixture dependencies and Chromium
              shell: bash
              working-directory: web/src/tests/fixtures/app-runtime-reference
              run: |
                  bun install --no-env-file --frozen-lockfile
                  node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium

            - name: Verify the native app runtime reference
              shell: bash
              run: |
                  bun --no-env-file --no-orphans .github/scripts/ci/fixtures/app-runtime-reference/run.ts "$ARCHITECTURE" "$RUNNER_TEMP/app-runtime-reference"
                  test -s "$RUNNER_TEMP/app-runtime-reference/native.json"
                  test -s "$RUNNER_TEMP/app-runtime-reference/browser.json"

            - name: Set up the controller Rust toolchain
              shell: bash
              run: |
                  rustup toolchain install 1.99.1 --profile minimal
                  rustup override set 1.99.1

            - name: Restore Cargo dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-1.99.1-${{ hashFiles('core/Cargo.lock') }}

            - name: Verify the signed Greeting package in Linux and Chromium
              shell: bash
              env:
                  REPOSITORY_ID: ${{ github.repository_id }}
              run: |
                  bun install --no-env-file --frozen-lockfile --ignore-scripts
                  bash .github/scripts/ci/fixtures/app-greeting-native.sh "$RUNNER_TEMP/app-runtime-reference" "$REPOSITORY_ID"

            - name: Upload native and browser evidence
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: app-runtime-reference-${{ matrix.architecture }}-${{ github.run_attempt }}
                  if-no-files-found: error
                  retention-days: 14
                  path: |
                      ${{ runner.temp }}/app-runtime-reference/native.json
                      ${{ runner.temp }}/app-runtime-reference/browser.json
                      ${{ runner.temp }}/app-runtime-reference/greeting.json
                      ${{ runner.temp }}/app-runtime-reference/greeting-browser.json
