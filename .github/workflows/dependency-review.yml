name: Dependency Review

on:
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: dependency-review-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    dependency-review:
        name: Dependency Review
        # The pull request already reviewed this exact dependency diff; a skipped merge queue
        # run satisfies the required check without repeating it.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Review dependency changes
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: moderate
                  vulnerability-check: true
                  license-check: false
